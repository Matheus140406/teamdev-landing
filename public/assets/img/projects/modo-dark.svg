<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <linearGradient id="mdlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cdeaff"/>
      <stop offset="1" stop-color="#a9dcff"/>
    </linearGradient>
    <linearGradient id="mddark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2340"/>
      <stop offset="1" stop-color="#5b46d6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="480" height="600" fill="url(#mdlight)"/>
  <rect x="480" y="0" width="480" height="600" fill="url(#mddark)"/>

  <!-- light side: sun + switch off -->
  <g transform="translate(240,270)">
    <polygon points="0,-34 8,-14 28,-22 16,-4 34,6 12,8 16,30 0,14 -16,30 -12,8 -34,6 -16,-4 -28,-22 -8,-14"
      fill="#ffd23f" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <rect x="-40" y="30" width="80" height="34" rx="17" fill="#a9c9e8"/>
    <circle cx="-23" cy="47" r="16" fill="#ffffff"/>
  </g>

  <!-- dark side: moon + switch on, glowing -->
  <g transform="translate(720,270)">
    <circle cx="0" cy="20" r="28" fill="#1c1730"/>
    <path d="M-10-32c-14 4-24 18-24 34 0 20 16 36 36 36 10 0 19-4 26-11-4 1-8 2-12 2-20 0-36-16-36-36 0-9 3-17 10-25z"
      fill="#ffd23f" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-40" y="30" width="80" height="34" rx="17" fill="#1e2230"/>
    <circle cx="23" cy="47" r="16" fill="#ffcc33">
      <animate attributeName="opacity" values="1;0.75;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="23" cy="47" r="26" fill="#ffcc33" opacity="0.25"/>
  </g>

  <rect x="470" y="0" width="20" height="600" fill="#12101c"/>

  <text x="60" y="60" font-family="Arial" font-size="16" fill="#1c3a52" font-weight="700" letter-spacing="1">MODO CLARO</text>
  <text x="580" y="60" font-family="Arial" font-size="16" fill="#e7e1ff" font-weight="700" letter-spacing="1">MODO ESCURO</text>
</svg>
