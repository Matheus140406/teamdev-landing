<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <linearGradient id="rdbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8ded4"/>
      <stop offset="1" stop-color="#fdf1ec"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#rdbg)"/>

  <!-- small clock badge, top-left -->
  <rect x="40" y="36" width="86" height="40" rx="10" fill="#2a2a2a"/>
  <text x="83" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#ffffff" font-weight="700">02:29</text>
  <text x="83" y="72" text-anchor="middle" font-family="Arial" font-size="9" fill="#c9c9c9">25/07/2026</text>

  <!-- countdown card -->
  <g>
    <rect x="290" y="220" width="380" height="200" rx="20" fill="#ffffff" opacity="0.55"/>
    <rect x="330" y="248" width="90" height="120" rx="14" fill="#7a6a67"/>
    <rect x="435" y="248" width="90" height="120" rx="14" fill="#7a6a67"/>
    <rect x="540" y="248" width="90" height="120" rx="14" fill="#7a6a67"/>

    <text x="375" y="315" text-anchor="middle" font-family="Arial" font-size="40" fill="#ffffff" font-weight="800">02</text>
    <text x="375" y="345" text-anchor="middle" font-family="Arial" font-size="15" fill="#f0e9e7" font-weight="700">Horas</text>

    <text x="480" y="315" text-anchor="middle" font-family="Arial" font-size="40" fill="#ffffff" font-weight="800">29</text>
    <text x="480" y="345" text-anchor="middle" font-family="Arial" font-size="15" fill="#f0e9e7" font-weight="700">Minutos</text>

    <text x="585" y="315" text-anchor="middle" font-family="Arial" font-size="40" fill="#ffffff" font-weight="800">27</text>
    <text x="585" y="345" text-anchor="middle" font-family="Arial" font-size="15" fill="#f0e9e7" font-weight="700">Segundos</text>
  </g>

  <text x="480" y="470" text-anchor="middle" font-family="Arial" font-size="14" fill="#b08b83" letter-spacing="2">CONTAGEM REGRESSIVA</text>
</svg>
