<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0a1f"/>
      <stop offset="1" stop-color="#0a0510"/>
    </linearGradient>
    <linearGradient id="aring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#abg)"/>
  <circle cx="46" cy="42" r="16" fill="#ec4899"/>
  <text x="74" y="50" font-family="Arial" font-size="20" fill="#fdf2fb" font-weight="700">Análise Corporal</text>
  <g font-family="Arial" font-size="14" fill="#e9d5f0">
    <text x="660" y="46">Avaliação</text>
    <text x="750" y="46">Histórico</text>
    <text x="830" y="46">Perfil</text>
  </g>

  <text x="60" y="180" font-family="Arial" font-size="36" fill="#fdf2fb" font-weight="700">Seus indicadores,</text>
  <text x="60" y="222" font-family="Arial" font-size="36" fill="#ec4899" font-weight="700">em um só lugar.</text>
  <text x="60" y="256" font-family="Arial" font-size="14" fill="#d8b4d8">Acompanhe composição corporal, IMC e evolução ao longo do tempo.</text>

  <circle cx="740" cy="230" r="120" fill="none" stroke="#3a1f42" stroke-width="18"/>
  <circle cx="740" cy="230" r="120" fill="none" stroke="url(#aring)" stroke-width="18" stroke-dasharray="565" stroke-dashoffset="140" stroke-linecap="round" transform="rotate(-90 740 230)"/>
  <text x="740" y="222" text-anchor="middle" font-family="Arial" font-size="34" fill="#fdf2fb" font-weight="700">76%</text>
  <text x="740" y="248" text-anchor="middle" font-family="Arial" font-size="12" fill="#d8b4d8">Meta atingida</text>

  <g>
    <rect x="60" y="400" width="255" height="140" rx="16" fill="#1f0f26" stroke="#3a1f42"/>
    <text x="88" y="435" font-family="Arial" font-size="14" fill="#fdf2fb" font-weight="700">Peso</text>
    <text x="88" y="465" font-family="Arial" font-size="22" fill="#ec4899" font-weight="700">72,4 kg</text>
    <text x="88" y="488" font-family="Arial" font-size="12" fill="#d8b4d8">-1,2kg este mês</text>

    <rect x="350" y="400" width="255" height="140" rx="16" fill="#1f0f26" stroke="#3a1f42"/>
    <text x="378" y="435" font-family="Arial" font-size="14" fill="#fdf2fb" font-weight="700">Gordura corporal</text>
    <text x="378" y="465" font-family="Arial" font-size="22" fill="#8b5cf6" font-weight="700">18,3%</text>
    <text x="378" y="488" font-family="Arial" font-size="12" fill="#d8b4d8">-0,8% este mês</text>

    <rect x="640" y="400" width="255" height="140" rx="16" fill="#1f0f26" stroke="#3a1f42"/>
    <text x="668" y="435" font-family="Arial" font-size="14" fill="#fdf2fb" font-weight="700">IMC</text>
    <text x="668" y="465" font-family="Arial" font-size="22" fill="#ec4899" font-weight="700">22,6</text>
    <text x="668" y="488" font-family="Arial" font-size="12" fill="#d8b4d8">Faixa normal</text>
  </g>
</svg>
